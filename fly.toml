# Ingestible — Document ingestion service
# Fly.io deployment configuration
#
# Deploy: fly deploy
# Logs:   fly logs
# SSH:    fly ssh console

app = "ingestible"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    EXTRAS = "pgvector,gemini"

[env]
  PORT = "8081"
  INGEST_DATA_DIR = "/app/data"
  INGEST_LOG_JSON = "true"
  WEB_CONCURRENCY = "2"
  GUNICORN_PRELOAD = "false"

  # Cloud embedding — no PyTorch needed, ~200MB RAM instead of ~3GB
  INGEST_EMBEDDING_PROVIDER = "openai"
  INGEST_EMBEDDING_MODEL = "text-embedding-3-small"

  # Lean searcher cache for cloud deployment
  INGEST_SEARCHER_CACHE_SIZE = "10"

# Secrets (set via: fly secrets set KEY=VALUE)
# Required:
#   INGEST_OPENAI_API_KEY     — for API-based embeddings
#   INGEST_GEMINI_API_KEY     — for LLM enrichment (or use INGEST_ANTHROPIC_API_KEY)
#   INGEST_API_KEYS           — comma-separated bearer tokens for auth

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "ingestible_data"
  destination = "/app/data"
