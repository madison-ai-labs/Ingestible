<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Capsule/pill outer shape — plays on "ingestible" -->
  <rect x="4" y="3" width="24" height="26" rx="12" ry="12" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Horizontal dividers — representing chunk layers L0→L3 -->
  <line x1="10" y1="10" x2="22" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="10" y1="16" x2="22" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="22" x2="22" y2="22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Center dot — the knowledge core -->
  <circle cx="16" cy="16" r="2" fill="currentColor"/>
</svg>
