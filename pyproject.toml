[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingestible"
version = "1.4.0"
description = "Document ingestion pipeline — transforms documents into a queryable knowledge store"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["rag", "document-ingestion", "embeddings", "search", "ai", "llm", "chunking", "pdf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    # Parsing
    "docling>=2.0",
    "pymupdf4llm>=0.0.10",
    "python-docx>=1.1",
    "markdownify>=0.13",
    "ebooklib>=0.18",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "docutils>=0.20",
    # LLM clients
    "openai>=1.0",
    "anthropic>=0.40",
    # Search (lightweight)
    "rank-bm25>=0.2",
    "tiktoken>=0.7",
    "numpy>=1.24",
    "networkx>=3.0",
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # API
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "aiofiles>=23.0",
    "httpx>=0.27",
    # Production
    "slowapi>=0.1",
    "portalocker>=2.0",
    "structlog>=24.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
# Local embedding models (adds ~2GB: torch + sentence-transformers + chromadb)
local = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
]
dev = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]
export = [
    "pyarrow>=14.0",
]
audio = [
    "faster-whisper>=1.0",
]
watch = [
    "watchdog>=4.0",
]
msg = [
    "extract-msg>=0.48",
]
mcp = [
    "mcp[cli]>=1.0",
]
gemini = [
    "google-genai>=1.0",
]
cohere = [
    "cohere>=5.0",
]
voyage = [
    "voyageai>=0.3",
]
pgvector = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
redaction = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    # After installing, download the NLP model:
    # python -m spacy download en_core_web_sm
]
cloud = [
    "boto3>=1.28",
    "google-cloud-storage>=2.0",
    "azure-storage-blob>=12.0",
]
code = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-kotlin>=1.0",
    "tree-sitter-scala>=0.23",
]

[project.scripts]
ingest = "ingestible.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestible"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert is fine in non-web code

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
