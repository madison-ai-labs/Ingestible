[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingestible"
version = "0.10.0"
description = "Document ingestion pipeline — transforms documents into a queryable knowledge store"
license = "Apache-2.0"
readme = "README.md"
keywords = ["rag", "document-ingestion", "embeddings", "search", "ai", "llm", "chunking", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0",
    "pymupdf4llm>=0.0.10",
    "openai>=1.0",
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2",
    "tiktoken>=0.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "markdownify>=0.13",
    "numpy>=1.24",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "aiofiles>=23.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
export = [
    "pyarrow>=14.0",
]

[project.scripts]
ingest = "ingestible.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestible"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
