# Ingestible — Cloud Production Stack
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars in .env:
#   INGEST_PGVECTOR_URL=postgresql://user:pass@host:5432/ingestible
#   INGEST_API_KEYS=<your-api-key>
#   INGEST_OPENAI_API_KEY=<key>           (for API-based embeddings)
#   INGEST_ANTHROPIC_API_KEY=<key>        (or INGEST_GEMINI_API_KEY for enrichment)

services:
  api:
    build:
      context: .
      args:
        EXTRAS: "pgvector,gemini"
    ports:
      - "8081:8081"
    volumes:
      - ingestible-data:/app/data
    env_file:
      - .env
    environment:
      - INGEST_DATA_DIR=/app/data
      - INGEST_VECTOR_BACKEND=pgvector
      - INGEST_EMBEDDING_PROVIDER=openai
      - INGEST_EMBEDDING_MODEL=text-embedding-3-small
      - INGEST_SEARCHER_CACHE_SIZE=10
      - INGEST_LOG_JSON=true
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8081/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ingestible-data:
