# Local development — ChromaDB (file-based, no external deps)
services:
  api:
    build:
      context: .
      args:
        EXTRAS: local
    ports:
      - "8081:8081"
    volumes:
      - ingestible-data:/app/data
    env_file:
      - .env
    environment:
      - INGEST_DATA_DIR=/app/data
      - INGEST_VECTOR_BACKEND=chroma
      - INGEST_LOG_JSON=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8081/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ingestible-data:
