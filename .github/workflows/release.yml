name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  # Run full CI before releasing
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hatch
      - run: hatch build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check if version already exists on PyPI
        id: check
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/ingestible/${VERSION}/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already on PyPI, skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.check.outputs.exists != 'true'

  binaries:
    name: Build standalone binaries
    needs: ci
    uses: ./.github/workflows/build-binaries.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  github-release:
    name: GitHub Release
    needs: [build, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p release/
          cp artifacts/dist/* release/
          cp artifacts/ingest-linux-x86_64/* release/
          cp artifacts/ingest-macos-arm64/* release/
          cp artifacts/ingest-windows-x86_64/* release/

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum ingest-* > checksums-sha256.txt

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Get previous tag
        id: prev_tag
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "")
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        run: |
          if [ -n "${{ steps.prev_tag.outputs.tag }}" ]; then
            log=$(git log --pretty=format:"- %s (%h)" "${{ steps.prev_tag.outputs.tag }}".."$GITHUB_REF_NAME" -- . ':!docs' ':!*.md')
          else
            log=$(git log --pretty=format:"- %s (%h)" "$GITHUB_REF_NAME" -- . ':!docs' ':!*.md')
          fi
          echo "$log" > /tmp/changelog.txt

      - name: Build release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"

          cat > /tmp/release-notes.md << 'HEADER'
          ## Install

          ### Standalone binary (no Python required)

          Download the binary for your platform, make it executable, and run:

          ```bash
          chmod +x ingest-*
          ./ingest-macos-arm64 --help
          ```

          | Platform | Binary |
          |----------|--------|
          HEADER

          cat >> /tmp/release-notes.md << EOF
          | Linux x86_64 | [\`ingest-linux-x86_64\`](https://github.com/${repo}/releases/download/${tag}/ingest-linux-x86_64) |
          | macOS (Apple Silicon) | [\`ingest-macos-arm64\`](https://github.com/${repo}/releases/download/${tag}/ingest-macos-arm64) |
          | Windows x86_64 | [\`ingest-windows-x86_64.exe\`](https://github.com/${repo}/releases/download/${tag}/ingest-windows-x86_64.exe) |
          EOF

          cat >> /tmp/release-notes.md << 'MID'

          ### Python package

          ```bash
          pip install ingestible
          ```

          ### Docker

          ```bash
          MID

          echo "docker pull ghcr.io/${repo,,}:${tag}" >> /tmp/release-notes.md

          cat >> /tmp/release-notes.md << 'MID2'
          ```

          ## What's changed
          MID2

          cat /tmp/changelog.txt >> /tmp/release-notes.md

          cat >> /tmp/release-notes.md << 'FOOTER'

          ## Checksums (SHA-256)

          ```
          FOOTER

          cat release/checksums-sha256.txt >> /tmp/release-notes.md
          echo '```' >> /tmp/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: /tmp/release-notes.md

  docker:
    name: Build & push Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
