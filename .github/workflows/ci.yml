name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q --junitxml=results-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: results-*.xml

  type-check:
    name: Import check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify all modules import
        run: |
          python -c "
          from ingestible.config import Settings
          from ingestible.models.chunks import ChunkSet, L0Chunk, L1Chunk, L2Chunk, L3Chunk
          from ingestible.models.document import ParsedDocument, DocumentStructure
          from ingestible.models.enrichment import L3Enrichment, KGTriple
          from ingestible.pipeline.orchestrator import ingest
          from ingestible.pipeline.stage1_parsing import parse_document, SUPPORTED_FORMATS
          from ingestible.pipeline.stage1c_classify import classify_block
          from ingestible.pipeline.stage3_chunking import chunk_document
          from ingestible.pipeline.stage4_enrichment import enrich_chunks
          from ingestible.pipeline.stage5_embedding import Embedder, build_indexes
          from ingestible.pipeline.stage6_storage import save_document, load_chunks
          from ingestible.pipeline.task_queue import TaskQueue
          from ingestible.pipeline.locking import document_lock
          from ingestible.pipeline.cloud import is_cloud_url
          from ingestible.pipeline.cleanup import cleanup_stale
          from ingestible.search.hybrid import HybridSearcher
          from ingestible.search.corpus import CorpusSearcher
          from ingestible.eval import evaluate_document
          from ingestible.metrics import INGEST_TOTAL
          from ingestible.logging import setup_logging
          from ingestible.utils.retry import retry_llm_call
          print('All modules import OK')
          "

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r src/ingestible/ -c pyproject.toml --severity-level medium -f json -o bandit-report.json || true
      - run: bandit -r src/ingestible/ -c pyproject.toml --severity-level high
        # Fail only on high severity

  # Gate: all checks must pass before merge
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, test, type-check, security]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.type-check.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
