<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IngestionTool{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-6">
    <a href="/" class="text-lg font-semibold text-indigo-600">IngestionTool</a>
    <a href="/" class="text-sm text-gray-600 hover:text-gray-900">Documents</a>
    <a href="/upload" class="text-sm text-gray-600 hover:text-gray-900">Upload</a>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <div id="htmx-indicator" class="htmx-indicator fixed top-0 left-0 right-0 h-1 bg-indigo-500"></div>
</body>
</html>
